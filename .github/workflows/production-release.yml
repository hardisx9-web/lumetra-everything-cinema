name: Production Verification & Build

on:
  push:
    branches: [ main, feature/cinematic-reconstruction ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify-and-build:
    name: Verify & Build Lumetra Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Run verification test suite
        run: |
          pnpm run test:artwork

      - name: Build production worker bundle
        run: |
          pnpm run build

      - name: Run in-runner staging server and verify E2E HTTP requests
        run: |
          node scripts/preview-catalogue.mjs &
          SERVER_PID=$!
          echo "Waiting for staging server to initialize..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:4173/api/stats | grep -q '"ready":true'; then
              echo "Staging server is ready!"
              break
            fi
            sleep 1
          done
          node scripts/test-staging-e2e.mjs
          kill $SERVER_PID
