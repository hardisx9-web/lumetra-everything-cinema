name: Lumetra public-safe provider probe
on:
  push:
    branches: [development/lumetra-recovery-20261021]
    paths:
      - .github/workflows/lumetra-provider-probe.yml
      - scripts/ci-provider-probe.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lumetra-public-provider-probe
  cancel-in-progress: false
jobs:
  live-provider-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve exact recovery history without altering application files
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          RECOVERY_SHA=8012235a0e7d17267f5c1b45d9cfaa4dad2081fb
          git bundle verify .recovery/Lumetra-Recovery-History.bundle
          git fetch .recovery/Lumetra-Recovery-History.bundle refs/heads/research/persistent-acquisition-20261020
          test "$(git rev-parse FETCH_HEAD)" = "$RECOVERY_SHA"
          if git merge-base --is-ancestor "$RECOVERY_SHA" "$GITHUB_SHA"; then
            echo "Exact recovery history already preserved"
          else
            TREE=$(git rev-parse "${GITHUB_SHA}^{tree}")
            MERGE_SHA=$(printf 'Preserve original Lumetra recovery history; application tree unchanged\n' | git -c user.name=github-actions\[bot\] -c user.email=41898282+github-actions\[bot\]@users.noreply.github.com commit-tree "$TREE" -p "$GITHUB_SHA" -p "$RECOVERY_SHA")
            git push origin "$MERGE_SHA:refs/heads/$GITHUB_REF_NAME"
            echo "Recovery history preserved at $MERGE_SHA with unchanged tree $TREE"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test acquisition safety and provider progress logic
        run: |
          python3 scripts/test-image-discovery-v3.py -q
          python3 scripts/test-image-acquisition.py -q
      - name: Run real live discovery without private state
        run: python3 scripts/ci-provider-probe.py
      - name: Upload public-safe provider summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumetra-provider-probe-${{ github.run_id }}
          path: .sites-runtime/provider-probe.json
          retention-days: 7
